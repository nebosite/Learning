<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravity Toy</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Gravity Simulation Toy A</h1>
      <p>Interactive n-body gravity simulation with real-time controls.</p>
    </header>

    <main>
      <section class="canvas-panel">
        <canvas id="gravityCanvas"></canvas>
      </section>

      <aside class="control-panel">
        <div class="control-group">
          <label for="starMassRange">Star mass (solar masses)</label>
          <input id="starMassRange" type="range" min="0.1" max="5" step="0.1" value="1" />
          <span id="starMassValue">1.0</span>
        </div>

        <div class="control-group">
          <label for="speedRange">Simulation speed (days/sec)</label>
          <input id="speedRange" type="range" min="0" max="10" step="0.1" value="1" />
          <span id="speedValue">1.0</span>
        </div>

        <div class="control-group">
          <label for="bodyCountRange">Body count</label>
          <input id="bodyCountRange" type="range" min="5" max="50" step="1" value="20" />
          <span id="bodyCountValue">20</span>
        </div>

        <div class="control-group">
          <label for="massScaleRange">Mass scale</label>
          <input id="massScaleRange" type="range" min="0.5" max="5" step="0.1" value="1" />
          <span id="massScaleValue">1.0x</span>
        </div>

        <div class="control-group checkbox-group">
          <input id="trailToggle" type="checkbox" checked />
          <label for="trailToggle">Show trails</label>
        </div>

        <div class="control-group checkbox-group">
          <input id="velocityToggle" type="checkbox" />
          <label for="velocityToggle">Show velocity vectors</label>
        </div>

        <div class="button-row">
          <button id="pauseButton">Pause</button>
          <button id="resetButton">Reset</button>
          <button id="addBodyButton">Add body</button>
          <button id="removeBodyButton">Remove body</button>
        </div>

        <div class="stats-panel">
          <div><strong>FPS:</strong> <span id="fpsValue">0</span></div>
          <div><strong>Bodies:</strong> <span id="bodyCountDisplay">0</span></div>
          <div><strong>Step:</strong> <span id="stepValue">0</span></div>
          <div><strong>Speed:</strong> <span id="speedDisplay">0</span> days/sec</div>
          <div><strong>Zoom:</strong> <span id="zoomDisplay">0</span> AU</div>
        </div>

        <div class="help-text">
          <p>Click the canvas to add a body in 3D space.</p>
          <p>Drag the scene to orbit, scroll to zoom.</p>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
